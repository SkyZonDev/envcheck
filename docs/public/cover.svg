    <text x="28" y="74"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">envcheck</tspan></text>
    <text x="28" y="106"><tspan fill="#22c55e">✓</tspan><tspan fill="#c9d1d9">  git            Git 2.45.1 satisfait &gt;=2.40.0</tspan></text>
    <text x="28" y="136"><tspan fill="#22c55e">✓</tspan><tspan fill="#c9d1d9">  node           Node 20.15.1 satisfait &gt;=20.0.0 &lt;23.0.0</tspan></text>
    <text x="28" y="166"><tspan fill="#f85149">✗</tspan><tspan fill="#c9d1d9">  docker-daemon  Le client Docker est disponible, mais le démon est inaccessible.</tspan></text>
    <text x="28" y="192"><tspan fill="#6e7681">    ↳ Démarrez Docker Desktop ou le service Docker.</tspan></text>
    <text x="28" y="222"><tspan fill="#f85149">✗</tspan><tspan fill="#c9d1d9">  database-url   La variable DATABASE_URL est absente</tspan></text>
    <text x="28" y="248"><tspan fill="#6e7681">    ↳ Copiez .env.example vers .env et renseignez DATABASE_URL.</tspan></text>
    <text x="28" y="296"><tspan fill="#e3b341" font-weight="700">2/4 contrôles requis réussis — environnement non prêt.</tspan></text>
