name: Bug
description: Signaler un comportement incorrect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Retirez toute valeur secrète** avant d'envoyer : tokens, mots de passe,
        contenus `.env`, variables d'environnement. `envcheck` ne les affiche
        jamais ; ne les recollez pas ici non plus.
  - type: textarea
    id: what
    attributes:
      label: Que s'est-il passé ?
      description: Comportement observé, et ce que vous attendiez.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: envcheck.yml
      description: La config (sans secrets). Vous pouvez masquer des hints.
      render: yaml
  - type: textarea
    id: output
    attributes:
      label: Sortie
      description: Texte ou JSON, secrets déjà retirés. `envcheck --format json` de préférence.
      render: json
  - type: input
    id: version
    attributes:
      label: Version
      description: Sortie de `envcheck --version` (ou `dev` si construit localement).
  - type: input
    id: os
    attributes:
      label: OS / arch
      placeholder: "macOS arm64, Linux amd64, Windows amd64…"
