name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath ./cmd/envcheck

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Vérifier la matrice d'artefacts
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          ls dist/envcheck_*_linux_amd64.tar.gz
          ls dist/envcheck_*_linux_arm64.tar.gz
          ls dist/envcheck_*_darwin_amd64.tar.gz
          ls dist/envcheck_*_darwin_arm64.tar.gz
          ls dist/envcheck_*_windows_amd64.zip
          if compgen -G "dist/envcheck_*_windows_arm64*" > /dev/null; then
            echo "windows/arm64 ne doit pas être publié (hors MVP)"
            exit 1
          fi
      - name: Préparer l'artefact Linux amd64
        run: |
          set -euo pipefail
          mkdir -p staging
          cp dist/checksums.txt staging/
          cp dist/envcheck_*_linux_amd64.tar.gz staging/
      - uses: actions/upload-artifact@v7
        with:
          name: envcheck-linux-amd64
          path: staging/
          if-no-files-found: error

  install:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: envcheck-linux-amd64
          path: pkg
      - name: Installer et exécuter l'artefact (runner sans Go)
        working-directory: pkg
        run: |
          set -euo pipefail
          archive=$(ls envcheck_*_linux_amd64.tar.gz)
          grep -F "$archive" checksums.txt | sha256sum -c
          tar -xzf "$archive"
          test -x envcheck
          version=$(./envcheck --version)
          echo "version: ${version}"
          case "${version}" in
            *"version dev"*)
              echo "la version n'a pas été injectée (ldflags)"
              exit 1
              ;;
          esac
          ./envcheck --help >/dev/null
          ./envcheck init --dry-run | grep -q "^version: 1$"
