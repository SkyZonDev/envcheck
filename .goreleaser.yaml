# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: envcheck

before:
  hooks:
    - go mod tidy

builds:
  - id: envcheck
    main: ./cmd/envcheck
    binary: envcheck
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Les notes GitHub viennent de CHANGELOG.md via --release-notes
# (scripts/extract-release-notes.sh), pas de la liste brute des commits.

snapshot:
  version_template: "0.0.0-snapshot-{{ .ShortCommit }}"
